<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>H&W Produce Signage</title>
    <link rel="stylesheet" href="./player.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="root">
      <!-- Full-bleed blurred fill (behind sharp media) -->
      <div id="mediaBg" aria-hidden="true">
        <img id="bgImage" alt="" hidden />
        <video id="bgVideo" playsinline muted loop autoplay hidden></video>
        <canvas id="bgCanvas" hidden></canvas>
        <div id="bgDim"></div>
      </div>

      <!-- Foreground sized to content so letterbox is NOT painted black by the video element -->
      <div id="mediaFg">
        <img id="imageView" alt="" hidden />
        <video id="videoView" playsinline muted loop autoplay hidden></video>
      </div>

      <div id="waitingPanel" class="panel">
        <h1>H&W PRODUCE</h1>
        <p id="waitingText">Waiting for signage…</p>
      </div>

      <!-- Always-visible device code (no mouse needed on Pi kiosk) -->
      <aside id="codeRail" class="code-rail code-rail--setup" aria-label="Device pairing code">
        <div class="code-rail__brand">H&W</div>
        <div class="code-rail__label" id="codeRailLabel">DEVICE CODE</div>
        <div class="code-rail__code" id="codeRailCode">---- ----</div>
        <div class="code-rail__hint" id="codeRailHint">Phone → Screens → Add Screen → enter this code</div>
        <div class="code-rail__sub" id="codeRailSub"></div>
      </aside>

      <div id="debugPanel" class="debug" hidden>
        <pre id="debugText"></pre>
        <p class="hint">Tap 3× anywhere or press Escape to close</p>
      </div>
    </div>
    <script src="./player.js?v=1.4.3"></script>
  </body>
</html>
